[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No explicit 404 redirect needed: Netlify automatically serves dist/404.html
# (generated from src/pages/404.astro) for any genuinely unmatched route. An
# earlier `from = "/*" to = "/404.html" status = 404` catch-all here was
# intercepting EVERY request that hits this file — including the POST to
# /thank-you after a Netlify Forms submission — before Netlify's form
# handling and normal static routing could process it, forcing a hard 404
# instead of the real thank-you page. Removed.

# Phase 2 (2026-10-03): old service URLs permanently redirect to the new pages.
[[redirects]]
  from = "/qualified-prospect-data"
  to = "/lead-lists"
  status = 301

[[redirects]]
  from = "/decision-maker-intelligence"
  to = "/lead-lists"
  status = 301

[[redirects]]
  from = "/prospect-intelligence"
  to = "/custom-research"
  status = 301

[[redirects]]
  from = "/market-icp-research"
  to = "/custom-research"
  status = 301

[[redirects]]
  from = "/managed-outreach"
  to = "/outreach"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301
